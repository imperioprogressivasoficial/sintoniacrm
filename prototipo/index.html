<title>Sintonia · Império</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de atendimento em 3 colunas (conversas | chat | ficha) com trilho de navegação; marca em azul, IA em menta */
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --sunk:#E9F0F7; --chat:#EDF3F9; --ink:#0F1E2E; --muted:#5B6B7C; --line:#DCE5EE;
  --brand:#106EBE; --brand-soft:#E3EFFA; --ai:#08876A; --ai-soft:#E0FBF3; --ai-line:#A6EFD9;
  --mint:#0FFCBE; --on-mint:#0B2A22;
  --ok:#1C7F55; --ok-soft:#E2F3EA; --warn:#9A6514; --warn-soft:#FBF0DC; --bad:#B23A3A;
  --out:#DCEBFA; --in:#FFFFFF; --av1:#D6E7F7; --av2:#CFF7EA; --av3:#E2E9F1; --av4:#D9EEF7;
  --f-display:"Urbanist",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1622; --surface:#112131; --sunk:#172B3E; --chat:#0D1B29; --ink:#E8F1F8; --muted:#93A6B8; --line:#20374C;
  --brand:#4FA3EC; --brand-soft:#15324D; --ai:#0FFCBE; --ai-soft:#0E3530; --ai-line:#1A5A4D;
  --mint:#0FFCBE; --on-mint:#0B1E1A;
  --ok:#5CCB98; --ok-soft:#173027; --warn:#E3B260; --warn-soft:#352914; --bad:#F08080;
  --out:#163652; --in:#172B3E; --av1:#1B3C5C; --av2:#124238; --av3:#22374B; --av4:#18394A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#112131; --sunk:#172B3E; --chat:#0D1B29; --ink:#E8F1F8; --muted:#93A6B8; --line:#20374C;
  --brand:#4FA3EC; --brand-soft:#15324D; --ai:#0FFCBE; --ai-soft:#0E3530; --ai-line:#1A5A4D;
  --mint:#0FFCBE; --on-mint:#0B1E1A;
  --ok:#5CCB98; --ok-soft:#173027; --warn:#E3B260; --warn-soft:#352914; --bad:#F08080;
  --out:#163652; --in:#172B3E; --av1:#1B3C5C; --av2:#124238; --av3:#22374B; --av4:#18394A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:68px 1fr;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* trilho */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--mint);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px;margin-bottom:10px}
.rail button{width:52px;border:0;background:none;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600}
.rail button svg{width:20px;height:20px}
.rail button[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.rail .spacer{flex:1}
main{min-width:0;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0}
/* conversas */
.inbox{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;height:100%}
.inbox.noprof{grid-template-columns:330px minmax(0,1fr)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.list{border-right:1px solid var(--line)}
.lhead{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brandline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brandline h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em}
.brandline small{color:var(--muted);font-size:11.5px}
.search{background:var(--sunk);border:0;border-radius:10px;padding:9px 12px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.items{overflow-y:auto;flex:1}
.item{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--sunk)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink)}
.av.sm{width:36px;height:36px;font-size:12.5px}
.iname{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.iname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilast{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.unread{background:var(--ok);color:var(--surface);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;font-size:10.5px;font-family:var(--f-body);font-weight:700;padding:0 5px}
.mode{font-family:var(--f-body);font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;letter-spacing:.02em;white-space:nowrap}
.m-ia{background:var(--ai-soft);color:var(--ai)}
.m-humano{background:var(--brand-soft);color:var(--brand)}
.m-copiloto{background:var(--ok-soft);color:var(--ok)}
.unit{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap;font-weight:600}
/* chat */
.chat{background:var(--chat)}
.chead{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chead .who{flex:1;min-width:140px}
.chead .who b{display:block;font-size:15px}
.chead .who small{color:var(--muted);font-size:12px}
.back{display:none;border:0;background:none;padding:6px;margin-left:-6px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.ai{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.btn.ghost{background:none}
.btn.small{padding:5px 10px;font-size:12px}
.profbtn{display:none}
.banner{margin:10px 16px 0;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600}
.banner .t{flex:1;min-width:180px}
.banner .count{font-family:var(--f-mono)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:var(--surface);color:var(--muted);font-size:11px;border-radius:8px;padding:3px 10px;margin:4px 0;font-weight:600}
.b{max-width:min(78%,520px);padding:7px 10px 5px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative;overflow-wrap:anywhere}
.b.cli{align-self:flex-start;background:var(--in);border-top-left-radius:4px}
.b.me,.b.ia{align-self:flex-end;background:var(--out);border-top-right-radius:4px}
.b .by{font-size:11px;font-weight:700;margin-bottom:2px}
.b.me .by{color:var(--brand)} .b.ia .by{color:var(--ai)}
.b .tm{font-size:10.5px;color:var(--muted);text-align:right;font-family:var(--f-mono);margin-top:2px}
.note{align-self:center;max-width:90%;background:var(--ai-soft);color:var(--ai);font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px;text-align:center}
.after{align-self:flex-end;max-width:min(78%,520px);font-size:12px;color:var(--ai);display:flex;gap:6px;align-items:flex-start;padding:0 4px}
.after svg,.ihead svg{width:14px;height:14px;flex:none;margin-top:2px}
.insight{align-self:flex-start;max-width:min(86%,560px);background:var(--surface);border:1px solid var(--ai-line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin:2px 0 6px}
.ihead{display:flex;gap:6px;align-items:flex-start;color:var(--ai);font-size:12px;font-weight:700}
.ihead span{font-weight:500;color:var(--muted)}
.sug{background:var(--ai-soft);border-radius:10px;padding:8px 10px;font-size:13.5px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.typing{align-self:flex-start;background:var(--in);border-radius:12px;padding:8px 12px;color:var(--muted);font-size:12px}
.live{margin:0 16px;background:var(--surface);border:1px solid var(--ai-line);border-bottom:0;border-radius:14px 14px 0 0;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.live .lt{color:var(--ai);font-weight:700;display:flex;gap:6px;align-items:center}
.live .lt i{width:7px;height:7px;border-radius:50%;background:var(--ai);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .lt i{animation:none}}
.li{display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.k-ok{background:var(--ok)} .k-warn{background:var(--warn)} .k-tip{background:var(--ai)} .k-act{background:var(--brand)}
.improved{background:var(--ai-soft);border-radius:8px;padding:6px 8px;color:var(--ink)}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:flex-end;position:relative}
.composer textarea{flex:1;resize:none;border:0;background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:42px;max-height:120px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}
.send{background:var(--brand);color:var(--surface)}
.qr{position:absolute;bottom:62px;left:16px;width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);padding:6px;z-index:5}
.qr button{width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.qr button:hover{background:var(--sunk)}
.qr b{font-size:13px} .qr span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted);padding:0 16px 8px;background:var(--surface)}
/* ficha */
.prof{border-left:1px solid var(--line);overflow-y:auto;padding:18px 16px;gap:16px}
.ptop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ptop .av{width:64px;height:64px;font-size:20px}
.ptop b{font-size:16px} .ptop small{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stage{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.stage b{font-family:var(--f-display);font-size:16px}
.stage small{color:var(--ai);font-size:11px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.summary{background:var(--ai-soft);border-radius:10px;padding:10px;font-size:13px}
.auto{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.auto:last-child{border-bottom:0}
.auto time{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--sunk);font-weight:600}
/* páginas */
.page{height:100%;overflow-y:auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ph h2{font-family:var(--f-display);font-size:28px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:8px}
.colk{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.colk h4{margin:0;display:flex;justify-content:space-between;font-size:13px;padding:2px 4px}
.colk h4 span{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.card{background:var(--surface);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);text-align:left;width:100%}
.card b{font-size:13.5px}
.card .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .mv{font-size:11px;color:var(--ai);font-weight:600}
.card.fresh{border-color:var(--ai)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile small{color:var(--muted);font-weight:600;font-size:12px}
.tile b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.tile span em{font-style:normal;color:var(--ok);font-weight:700}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:6px}
.bar .n{font-family:var(--f-mono);text-align:right;font-size:12px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.phone{background:var(--chat);border-radius:22px;border:8px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;max-width:360px;width:100%;margin:0 auto}
.phone .ptitle{font-size:12px;font-weight:700;text-align:center;color:var(--muted)}
.phone .b{max-width:100%;font-size:13px;white-space:pre-line}
.flows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.flow .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.flow b{font-size:14.5px}
.flow p{margin:0;color:var(--muted);font-size:13px}
.flow .st{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.flow .st strong{color:var(--ink);font-family:var(--f-mono)}
.sw{position:relative;width:40px;height:23px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;pointer-events:none;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:transform .2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(17px)}
.sw input:focus-visible+span{outline:2px solid var(--ai);outline-offset:2px}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--warn-soft);color:var(--warn);align-self:flex-start}
.example{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--sunk);border-radius:6px;padding:3px 8px;align-self:flex-start}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,10,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-family:var(--f-display);font-size:20px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.modal select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-weight:500;color:var(--ink);font-size:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days,.slots{display:flex;gap:6px;flex-wrap:wrap}
.days button,.slots button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.days button small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.slots button{font-family:var(--f-mono);font-size:12.5px}
.days button[aria-pressed="true"],.slots button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.days button[aria-pressed="true"] small{color:var(--surface)}
.slots button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
/* responsivo */
@media (max-width:1180px){
  .inbox,.inbox.noprof{grid-template-columns:300px minmax(0,1fr)}
  .prof{position:fixed;right:0;top:0;bottom:0;width:min(320px,100%);z-index:15;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .profbtn{display:inline-flex}
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
  .logo,.rail .spacer{display:none}
  .inbox,.inbox.noprof{grid-template-columns:1fr}
  .inbox.inchat .list{display:none}
  .inbox:not(.inchat) .chat{display:none}
  .back{display:block}
  .flows{grid-template-columns:1fr}
  .bar{grid-template-columns:110px minmax(0,1fr) 30px}
  .chead .seg{order:5;width:100%}
  .chead .seg button{flex:1}
  .f2{grid-template-columns:1fr}
}
</style>

<div class="app">

/* revisão ao vivo */
function analyze(d,c){
 d=d.trim();if(!d||d.startsWith('/'))return null;
 const it=[];
 const pm=d.match(/r\$\s?(\d+)/i);
 if(pm&&+pm[1]!==320&&c.id==='c1')it.push(['warn','Valor diferente da tabela: Progressiva Império longa é R$ 320 na Norte Shopping.']);
 if(/(amanh|hoje|s[áa]bado|domingo|dia \d|hor[áa]rio|\d{1,2}h)/i.test(d))it.push(['act','Você citou data ou horário. Confira a agenda do Trinks antes de confirmar.','agenda']);
 if(/n[ãa]o sei/i.test(d))it.push(['warn','"Não sei" passa insegurança. A resposta certa está na base da Império: duração média de 3 a 4 meses.']);
 if(d.length<14)it.push(['tip','Resposta curta. Aproveite para conduzir: proponha um horário.']);
 else if(!d.includes('?'))it.push(['tip','Termine com uma pergunta para levar ao agendamento.']);
 const ok=!it.length;
 if(ok)it.push(['ok','Mensagem clara e no tom da Império. Pode enviar.']);
 let imp=null;
 if(!ok){imp=d.replace(/n[ãa]o sei[^.?!]*[.?!]?/i,'Dura em média de 3 a 4 meses.').replace(/[\s.!]+$/,'');
  if(pm&&+pm[1]!==320&&c.id==='c1')imp=imp.replace(/r\$\s?\d+/i,'R$ 320');
  if(!imp.includes('?'))imp+=(imp.length<14?'! ':'. ')+'Quer que eu já reserve um horário pra você essa semana?';}
 return {it,imp}
}

 const c=conv();const a=analyze(S.draft,c);const el=$('#live');
 const hint=$('#hint');
 hint.textContent=c.mode==='ia'?'A IA está conduzindo esta conversa. Se você digitar, ela pausa e vira copiloto.':c.mode==='humano'?'Só você: a IA não sugere, mas continua movendo o funil e registrando.':'Copiloto: a IA lê cada mensagem e revisa o que você escreve, mas nunca envia por você.';
 if(!a||c.mode==='humano'){el.innerHTML='';return}
 el.innerHTML=`<div class="live"><div class="lt"><i></i>IA revisando enquanto você digita</div>
  ${a.it.map(([k,t,act])=>`<div class="li"><span class="dot k-${k}"></span><span style="flex:1">${esc(t)}</span>${act?'<button class="btn small" data-x="ag">Abrir agenda</button>':''}</div>`).join('')}
  ${a.imp?`<div class="li"><span class="dot k-tip"></span><div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="improved">${esc(a.imp)}</span><div class="row"><button class="btn small ai" data-x="imp">Usar esta versão</button></div></div></div>`:''}
 </div>`;
 el.querySelector('[data-x="ag"]')?.addEventListener('click',()=>openAgenda());
 el.querySelector('[data-x="imp"]')?.addEventListener('click',()=>{S.draft=a.imp;const ta=$('#draft');ta.value=a.imp;ta.focus();renderLive()});
}
function renderQR(){
 const box=$('#qrbox');if(!S.qr){box.innerHTML='';return}
 const q=S.draft.startsWith('/')?S.draft.slice(1).toLowerCase():'';
 const l=QUICK.filter(x=>x.t.toLowerCase().includes(q));
 box.innerHTML=`<div class="qr" role="listbox">${l.map((x,i)=>`<button data-i="${QUICK.indexOf(x)}"><b>/${esc(x.t)}</b><span>${esc(x.m)}</span></button>`).join('')||'<p style="padding:8px;margin:0;color:var(--muted)">Nenhuma mensagem rápida.</p>'}</div>`;
 box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const m=QUICK[+b.dataset.i].m;S.draft=m;S.qr=false;const ta=$('#draft');ta.value=m;ta.focus();renderQR();renderLive()});
}
function reviewSent(d){
 if(/\?/.test(d))return 'Boa condução: terminou com pergunta. Se ela não responder em 2h, eu faço o follow-up.';
 return 'Enviado. Se ela não responder em 2h, eu mando um follow-up perguntando o melhor horário.';
}
function send(){
 const c=conv();const d=S.draft.trim();if(!d||d.startsWith('/'))return;
 const byIA=false;
 c.msgs.push({f:'me',by:'Você',t:d,h:now(),review:c.mode!=='humano'?reviewSent(d):null});
 c.suggest=null;S.draft='';S.qr=false;$('#draft').value='';$('#draft').style.height='auto';
 if(c.stage==='Novo lead'){c.stage='Em conversa'}
 renderMsgs();renderLive();renderQR();renderList();
 const nx=c.script.shift();
 if(nx){setTimeout(()=>{c.msgs.push({f:'typing'});if(c.id===S.active)renderMsgs();
  setTimeout(()=>{c.msgs=c.msgs.filter(m=>m.f!=='typing');c.msgs.push({f:'cli',t:nx.t,h:now()});
   c.suggest={intent:nx.intent,opts:nx.opts};
   if(c.id!==S.active)c.unread++;renderList();if(c.id===S.active){renderMsgs();renderProf()}},1600)},900)}
}
/* IA assume quando a atendente some */
function renderBanner(){
 const c=conv();const el=$('#banner');clearInterval(S.timer);
 if(!c.takeover){el.innerHTML='';return}
 const draw=()=>{el.innerHTML=`<div class="banner"><span class="t">${esc(c.att)} disse que ia verificar há 49 min e não voltou. A IA assume em <span class="count">${c.takeover.left}s</span>.</span>
  <button class="btn small ai" id="tk">Deixar a IA responder agora</button><button class="btn small" id="tc">Eu respondo</button></div>`;
  $('#tk').onclick=()=>doTake(c);$('#tc').onclick=()=>{cancelTake(c,true);$('#draft').focus()}};
 draw();
 S.timer=setInterval(()=>{c.takeover.left--;if(c.takeover.left<=0){doTake(c)}else{const n=el.querySelector('.count');if(n)n.textContent=c.takeover.left+'s'}},1000);
}
function doTake(c){clearInterval(S.timer);const t=c.takeover.text;c.takeover=null;c.mode='ia';c.suggest=null;
 c.msgs.push({f:'note',t:'IA assumiu: cliente sem resposta há 49 min em horário de atendimento'});
 c.msgs.push({f:'ia',t,h:now()});c.p.autos=[['Follow-up se não responder','em 30 min']];
 renderBanner();renderHead();renderMsgs();renderList();renderProf();renderLive();toast('A IA assumiu a conversa com Fernanda');
 setTimeout(()=>{c.msgs.push({f:'cli',t:'Pode sim, obrigada!!',h:now()});c.msgs.push({f:'ia',t:'Prontinho, Fernanda! Hidratação hoje às 17h30 com a Bia no Sumaré. Te mando um lembrete 1h antes',h:now()});
  c.msgs.push({f:'note',t:'Agendamento criado no Trinks pela IA · etapa movida para Agendada'});c.stage='Agendada';c.p.next='Hoje 17:30 · Hidratação · Bia';
  c.p.autos=[['Lembrete 1h antes','16:30']];if(S.active===c.id){renderMsgs();renderProf()}renderList()},3500)}
function cancelTake(c,human){clearInterval(S.timer);c.takeover=null;if(human){c.mode='humano'};$('#banner').innerHTML='';c.p.autos=c.p.autos.filter(a=>!a[0].startsWith('IA assume'));renderProf();renderHead()}

/* ---------- agendar ---------- */
const SERV=[['Progressiva Império (longo)',320,'3h'],['Progressiva Império (médio)',270,'2h30'],['Hidratação profunda',90,'1h'],['Manutenção de raiz',180,'2h']];
const PROF={Norte:['Jéssica','Carla','Rafa'],Sumaré:['Bia','Lu'],Feira:['Em breve']};
const SLOTS=['09:00','10:00','11:30','13:00','14:00','15:30','17:00','18:30'];
function openAgenda(){
 const c=conv();const unit=c.unit==='Feira'?'Norte':c.unit;
 const base=new Date();const days=[...Array(6)].map((_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i+1);return d});
 const A={unit,serv:c.id==='c2'?2:0,prof:PROF[unit][0],day:c.id==='c1'?days.findIndex(d=>d.getDate()===15):0,slot:null};
 if(A.day<0)A.day=0;
 const fmt=d=>d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
 const draw=()=>{
  const taken=SLOTS.map((s,i)=>((i*7+A.day*3+A.prof.length)%5)===0);
  $('#ov').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="agt">
   <h3 id="agt">Agendar ${esc(c.name.split(' ')[0])}</h3>
   <div class="f2">
    <label for="au">Unidade<select id="au">${['Norte','Sumaré'].map(u=>`<option value="${u}" ${u===A.unit?'selected':''}>${unitName(u)}</option>`).join('')}</select></label>
    <label for="ap">Profissional<select id="ap">${PROF[A.unit].map(p=>`<option ${p===A.prof?'selected':''}>${p}</option>`).join('')}</select></label>
   </div>
   <label for="as">Serviço<select id="as">${SERV.map((s,i)=>`<option value="${i}" ${i===A.serv?'selected':''}>${s[0]} · R$ ${s[1]} · ${s[2]}</option>`).join('')}</select></label>
   <div style="display:flex;flex-direction:column;gap:6px"><label style="pointer-events:none">Dia</label><div class="days">${days.map((d,i)=>`<button data-d="${i}" aria-pressed="${i===A.day}"><small>${fmt(d)}</small>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</button>`).join('')}</div></div>
   <div style="display:flex;flex-direction:column;gap:6px"><label style="pointer-events:none">Horários livres no Trinks</label><div class="slots">${SLOTS.map((s,i)=>`<button data-s="${s}" ${taken[i]?'disabled':''} aria-pressed="${A.slot===s}">${s}</button>`).join('')}</div></div>
   <div class="mfoot"><span>Ao confirmar: cria no Trinks, envia a confirmação e programa os lembretes.</span>
    <div class="row"><button class="btn" id="acx">Cancelar</button><button class="btn primary" id="aok" ${A.slot?'':'disabled style="opacity:.5"'}>Confirmar agendamento</button></div></div>
  </div>`;
  $('#au').onchange=e=>{A.unit=e.target.value;A.prof=PROF[A.unit][0];A.slot=null;draw()};
  $('#ap').onchange=e=>{A.prof=e.target.value;A.slot=null;draw()};
  $('#as').onchange=e=>{A.serv=+e.target.value};
  $('#ov').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{A.day=+b.dataset.d;A.slot=null;draw()});
  $('#ov').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{A.slot=b.dataset.s;draw()});
  $('#acx').onclick=closeOv;
  $('#aok').onclick=()=>{if(!A.slot)return;const d=days[A.day];const ds=`${fmt(d)}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
   c.msgs.push({f:'me',by:'Você',t:`Prontinho, ${c.name.split(' ')[0]}! Seu horário está confirmado: ${SERV[A.serv][0]}, ${ds} às ${A.slot} com ${A.prof} no ${unitName(A.unit)}. Te mando um lembrete na véspera`,h:now()});
   c.msgs.push({f:'note',t:'Criado no Trinks · etapa movida para Agendada · lembretes de 24h e 2h programados'});
   c.stage='Agendada';c.suggest=null;c.p.next=`${ds} ${A.slot} · ${A.prof}`;c.p.autos=[['Lembrete 24h antes','véspera 09:00'],['Lembrete 2h antes','no dia'],['Pesquisa pós-atendimento','dia seguinte']];
   closeOv();renderMsgs();renderProf();renderList();toast('Agendamento criado no Trinks')};
 };
 $('#ov').hidden=false;draw();
}
function closeOv(){$('#ov').hidden=true;$('#ov').innerHTML=''}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeOv()});

 </div></div>`;
