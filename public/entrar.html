<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<script>/* Sem zoom com os dedos nem com toque duplo: a ferramenta já se ajusta à tela. */(()=>{const nao=(e)=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach((t)=>document.addEventListener(t,nao,{passive:false}));document.addEventListener('touchmove',(e)=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});})();</script>
<!-- atualizando: durante uma publicação, mostra "Estamos atualizando melhorias" em vez de erro (antes de qualquer fetch). -->
<script src="/telas/atualizando.js"></script>
<title>Entrar · Sintonia CRM</title>
<meta name="theme-color" content="#106EBE">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon-escuro-64.png" type="image/png" sizes="64x64" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icone-180.png" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icone-escuro-180.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sintonia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sintony:wght@400;700&display=swap">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/abertura.css">
</head>
<body>
<div class="tela-login">
  <section class="lado-azul">
    <div class="arco" aria-hidden="true"></div>
    <a class="logo" href="/" aria-label="Sintonia CRM, início"><img src="/simbolo-escuro.png" alt="" width="40" height="40" style="filter:drop-shadow(0 4px 14px rgba(15,252,190,.35))"><span>sintonia<b>.</b></span></a>
    <div>
      <h1>Bom te ver de novo. <em>Suas clientes estão esperando.</em></h1>
      <p>Entre para ver suas conversas, as sugestões da IA e a agenda do dia.</p>
    </div>
    <span></span>
  </section>

  <section class="lado-form">
    <form class="cartao" id="form-entrar" novalidate>
      <div>
        <h2>Entrar</h2>
        <p class="sub">Use o e-mail cadastrado pela sua empresa.</p>
      </div>
      <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha"><input id="senha" name="senha" type="password" autocomplete="current-password" required><button type="button" id="ver-senha" aria-controls="senha">Mostrar</button></div>
      </div>
      <div id="aviso-entrar" role="status" aria-live="polite"></div>
      <button class="botao botao-azul" type="submit">Entrar</button>
      <p class="miudo"><a href="/esqueci-senha" id="link-esqueci">Esqueci minha senha</a></p>
    </form>
  </section>
</div>

<div class="abertura" id="abertura" role="status" aria-live="polite" aria-label="Abrindo o aplicativo" hidden>
  <div class="ab-topo" aria-hidden="true"><span></span></div>
  <div class="ab-con-loader" aria-hidden="true"><svg class="ab-con-svg" width="72" height="72" viewBox="0 0 72 72" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><linearGradient id="ab-con-ge" gradientUnits="userSpaceOnUse" x1="19" y1="0" x2="26" y2="0"><stop offset="0" stop-color="#3aa0ff" stop-opacity="0"/><stop offset="1" stop-color="#3aa0ff"/></linearGradient><linearGradient id="ab-con-gd" gradientUnits="userSpaceOnUse" x1="53" y1="0" x2="46" y2="0"><stop offset="0" stop-color="#0ffcbe" stop-opacity="0"/><stop offset="1" stop-color="#0ffcbe"/></linearGradient><radialGradient id="ab-con-gj"><stop offset="0" stop-color="#0ffcbe" stop-opacity=".4"/><stop offset="1" stop-color="#0ffcbe" stop-opacity="0"/></radialGradient></defs><circle cx="36" cy="36" r="29" stroke="#e9f3ff" stroke-opacity=".07" stroke-width="1.5"/><g class="ab-con-giro"><circle class="ab-con-arco ab-con-g" cx="36" cy="36" r="29" pathLength="100" stroke="#0ffcbe" stroke-width="5"/><circle class="ab-con-arco" cx="36" cy="36" r="29" pathLength="100" stroke="#0ffcbe" stroke-width="1.5"/><circle class="ab-con-b" cx="36" cy="36" r="29" pathLength="100" stroke="#e9f3ff" stroke-width="1.5" stroke-dasharray="5 100"/></g><circle class="ab-con-j" cx="36" cy="36" r="11" fill="url(#ab-con-gj)"/><g class="ab-con-e"><line x1="19" y1="36" x2="29" y2="36" stroke="url(#ab-con-ge)" stroke-width="1.5"/><path d="M36 34.5H39M36 37.5H39" stroke="#3aa0ff" stroke-width="1.5"/><path d="M31.5 32.5H36V39.5H31.5A2.5 2.5 0 0 1 29 37V35A2.5 2.5 0 0 1 31.5 32.5Z" fill="#06192f" stroke="#3aa0ff" stroke-width="1.5"/></g><g class="ab-con-d"><line x1="53" y1="36" x2="43" y2="36" stroke="url(#ab-con-gd)" stroke-width="1.5"/><path d="M36 32.5H40.5A2.5 2.5 0 0 1 43 35V37A2.5 2.5 0 0 1 40.5 39.5H36Z" fill="#06192f" stroke="#0ffcbe" stroke-width="1.5"/></g></svg></div>
  <p class="ab-texto">Abrindo suas conversas<small>Só um instante</small></p>
</div>
<script>
(() => {
  const form = document.getElementById('form-entrar');
  const aviso = document.getElementById('aviso-entrar');
  const senha = document.getElementById('senha');
  const ver = document.getElementById('ver-senha');
  ver.addEventListener('click', () => {
    const mostrando = senha.type === 'text';
    senha.type = mostrando ? 'password' : 'text';
    ver.textContent = mostrando ? 'Mostrar' : 'Esconder';
  });
  // Senha certa: o cartão sai com desfoque e escala, entra a tela "abrindo o aplicativo" e só então vai para o /app.
  const abrirApp = () => {
    const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ab = document.getElementById('abertura');
    const p = (v) => ab.style.setProperty('--ab-p', String(v));
    form.classList.add('saindo');
    document.querySelector('.lado-azul')?.classList.add('saindo');
    setTimeout(() => {
      ab.hidden = false; ab.classList.add('ab-entrando'); p(0.06);
      requestAnimationFrame(() => requestAnimationFrame(() => { ab.classList.remove('ab-entrando'); p(0.35); }));
      setTimeout(() => p(0.6), reduz ? 120 : 450);
      setTimeout(() => p(0.72), reduz ? 240 : 850);
    }, reduz ? 120 : 360);
    setTimeout(() => {
      try { sessionStorage.setItem('sintonia.abertura', String(Date.now())); } catch {}
      location.href = destino();
    }, reduz ? 450 : 1400);
  };
  /* rotas-fontes: veio de um link do app (/entrar?volta=/app/conversas/…): depois de entrar, volta para lá.
     Só endereços do próprio app; o #… dos links antigos (ex.: #conversa=…) vai junto. */
  const destino = () => {
    let v = '';
    try { v = new URLSearchParams(location.search).get('volta') || ''; } catch {}
    const ok = v.length <= 300 && /^\/(app|conexoes)(?=[/?]|$)/.test(v) && !/[\\\s]|\/\/|%2f%2f|%5c/i.test(v);
    return (ok ? v : '/app') + (location.hash && location.hash.length < 200 ? location.hash : '');
  };
  const email = document.getElementById('email');
  document.getElementById('link-esqueci').addEventListener('click', (e) => {
    if (!email.value.trim()) return;
    e.preventDefault(); location.href = '/esqueci-senha?email=' + encodeURIComponent(email.value.trim());
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const dados = Object.fromEntries(new FormData(form));
    if (!dados.email || !dados.senha) { aviso.className = 'aviso erro'; aviso.textContent = 'Preencha e-mail e senha.'; return; }
    const botao = form.querySelector('button[type=submit]');
    botao.disabled = true;
    try {
      const r = await fetch('/api/auth/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { abrirApp(); return; }
      aviso.className = 'aviso erro';
      aviso.textContent = j.erro || 'Não foi possível entrar agora.';
    } catch { aviso.className = 'aviso erro'; aviso.textContent = 'Sem conexão. Tente de novo.'; }
    finally { botao.disabled = false; }
  });
})();
</script>
</body>
</html>
