<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Sintonia CRM</title>
<meta name="theme-color" content="#106EBE">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon-escuro-64.png" type="image/png" sizes="64x64" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icone-180.png" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icone-escuro-180.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sintonia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sintony:wght@400;700&display=swap">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/abertura.css">
</head>
<body>
<div class="tela-login">
  <section class="lado-azul">
    <div class="arco" aria-hidden="true"></div>
    <a class="logo" href="/" aria-label="Sintonia CRM, início"><img src="/simbolo-escuro.png" alt="" width="40" height="40" style="filter:drop-shadow(0 4px 14px rgba(15,252,190,.35))"><span>sintonia<b>.</b></span></a>
    <div>
      <h1>Bom te ver de novo. <em>Suas clientes estão esperando.</em></h1>
      <p>Entre para ver suas conversas, as sugestões da IA e a agenda do dia.</p>
    </div>
    <span></span>
  </section>

  <section class="lado-form">
    <form class="cartao" id="form-entrar" novalidate>
      <div>
        <h2>Entrar</h2>
        <p class="sub">Use o e-mail cadastrado pela sua empresa.</p>
      </div>
      <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha"><input id="senha" name="senha" type="password" autocomplete="current-password" required><button type="button" id="ver-senha" aria-controls="senha">Mostrar</button></div>
      </div>
      <div id="aviso-entrar" role="status" aria-live="polite"></div>
      <button class="botao botao-azul" type="submit">Entrar</button>
      <p class="miudo"><a href="/esqueci-senha" id="link-esqueci">Esqueci minha senha</a></p>
    </form>
  </section>
</div>

<div class="abertura" id="abertura" role="status" aria-live="polite" aria-label="Abrindo o aplicativo" hidden>
  <div class="ab-simbolo" aria-hidden="true"><span class="ab-brilho"></span><span class="ab-anel"></span><img src="/simbolo-escuro.png" alt="" width="64" height="64"></div>
  <p class="ab-texto">Abrindo o aplicativo<small>Preparando suas conversas</small></p>
  <div class="ab-barra" aria-hidden="true"><span></span></div>
</div>
<script>
(() => {
  const form = document.getElementById('form-entrar');
  const aviso = document.getElementById('aviso-entrar');
  const senha = document.getElementById('senha');
  const ver = document.getElementById('ver-senha');
  ver.addEventListener('click', () => {
    const mostrando = senha.type === 'text';
    senha.type = mostrando ? 'password' : 'text';
    ver.textContent = mostrando ? 'Mostrar' : 'Esconder';
  });
  // Senha certa: o cartão sai com desfoque e escala, entra a tela "abrindo o aplicativo" e só então vai para o /app.
  const abrirApp = () => {
    const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ab = document.getElementById('abertura');
    const p = (v) => ab.style.setProperty('--ab-p', String(v));
    form.classList.add('saindo');
    document.querySelector('.lado-azul')?.classList.add('saindo');
    setTimeout(() => {
      ab.hidden = false; ab.classList.add('ab-entrando'); p(0.06);
      requestAnimationFrame(() => requestAnimationFrame(() => { ab.classList.remove('ab-entrando'); p(0.35); }));
      setTimeout(() => p(0.6), reduz ? 120 : 450);
      setTimeout(() => p(0.72), reduz ? 240 : 850);
    }, reduz ? 120 : 360);
    setTimeout(() => {
      try { sessionStorage.setItem('sintonia.abertura', String(Date.now())); } catch {}
      location.href = '/app';
    }, reduz ? 450 : 1400);
  };
  const email = document.getElementById('email');
  document.getElementById('link-esqueci').addEventListener('click', (e) => {
    if (!email.value.trim()) return;
    e.preventDefault(); location.href = '/esqueci-senha?email=' + encodeURIComponent(email.value.trim());
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const dados = Object.fromEntries(new FormData(form));
    if (!dados.email || !dados.senha) { aviso.className = 'aviso erro'; aviso.textContent = 'Preencha e-mail e senha.'; return; }
    const botao = form.querySelector('button[type=submit]');
    botao.disabled = true;
    try {
      const r = await fetch('/api/auth/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { abrirApp(); return; }
      aviso.className = 'aviso erro';
      aviso.textContent = j.erro || 'Não foi possível entrar agora.';
    } catch { aviso.className = 'aviso erro'; aviso.textContent = 'Sem conexão. Tente de novo.'; }
    finally { botao.disabled = false; }
  });
})();
</script>
</body>
</html>
