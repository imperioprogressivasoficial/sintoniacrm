<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criar senha · Sintonia CRM</title>
<meta name="theme-color" content="#106EBE">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon-escuro-64.png" type="image/png" sizes="64x64" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icone-180.png" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icone-escuro-180.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sintonia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sintony:wght@400;700&display=swap">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<div class="tela-login">
  <section class="lado-azul">
    <div class="arco" aria-hidden="true"></div>
    <a class="logo" href="/" aria-label="Sintonia CRM, início"><img src="/simbolo-escuro.png" alt="" width="40" height="40" style="filter:drop-shadow(0 4px 14px rgba(15,252,190,.35))"><span>sintonia<b>.</b></span></a>
    <div>
      <h1>Boas-vindas à equipe. <em>Falta só a sua senha.</em></h1>
      <p>Crie uma senha só sua para entrar no Sintonia.</p>
    </div>
    <span></span>
  </section>
  <section class="lado-form">
    <form class="cartao" id="form-convite" novalidate>
      <div>
        <h2 id="titulo">Criar senha</h2>
        <p class="sub" id="quem">Conferindo o link…</p>
      </div>
      <div class="campo">
        <label for="senha">Nova senha</label>
        <div class="senha"><input id="senha" name="senha" type="password" autocomplete="new-password" minlength="10" required><button type="button" id="ver-senha" aria-controls="senha">Mostrar</button></div>
      </div>
      <div class="campo"><label for="senha2">Repita a senha</label><input id="senha2" name="senha2" type="password" autocomplete="new-password" required></div>
      <p class="miudo">Pelo menos 10 caracteres, com letras e números.</p>
      <div id="aviso" role="status" aria-live="polite"></div>
      <button class="botao botao-azul" type="submit" id="ok" disabled>Salvar e entrar</button>
    </form>
  </section>
</div>
<script>
(() => {
  const t = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  const erro = (m) => { $('aviso').className = 'aviso erro'; $('aviso').textContent = m; };
  let email = '';
  $('ver-senha').addEventListener('click', () => { const s = $('senha'); const m = s.type === 'text'; s.type = m ? 'password' : 'text'; $('senha2').type = s.type; $('ver-senha').textContent = m ? 'Mostrar' : 'Esconder'; });
  fetch('/api/auth/convite?t=' + encodeURIComponent(t)).then(async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('quem').textContent = j.erro || 'Link inválido.'; return; }
    email = j.email;
    $('titulo').textContent = j.tipo === 'redefinir' ? 'Nova senha' : 'Criar senha';
    $('quem').textContent = `${j.nome} · ${j.email}`;
    $('ok').disabled = false;
  }).catch(() => { $('quem').textContent = 'Sem conexão. Tente de novo.'; });
  $('form-convite').addEventListener('submit', async (e) => {
    e.preventDefault();
    const senha = $('senha').value;
    if (senha !== $('senha2').value) return erro('As duas senhas não são iguais.');
    $('ok').disabled = true;
    try {
      const r = await fetch('/api/auth/convite', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t, senha }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { erro(j.erro || 'Não deu certo.'); $('ok').disabled = false; return; }
      const e2 = await fetch('/api/auth/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, senha }) });
      location.href = e2.ok ? '/app' : '/entrar';
    } catch { erro('Sem conexão. Tente de novo.'); $('ok').disabled = false; }
  });
})();
</script>
</body>
</html>
